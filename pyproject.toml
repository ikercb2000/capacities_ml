[project]
name = "capacities_ml"
version = "0.1.0"
description = "A Python package for learning capacities and use capacity-based learning models."
authors = [
    {name = "ikercb2000",email = "ikercb2000@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "matplotlib (>=3.11.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "polars (>=1.43.1,<2.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "commitizen (>=4.17.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

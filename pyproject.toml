[project]
name = "capacities_ml_fin"
version = "0.1.0"
description = "Capacities, Choquet machine learning, and non-additive financial risk measures."
authors = [
    {name = "ikercb2000", email = "ikercb2000@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy (>=2.5.1,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "cvxpy (>=1.9.2,<2.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "pymoo (>=0.6.2,<0.7.0)",
]

[tool.poetry]
packages = [{include = "capacities_ml_fin", from = "src"}]

[dependency-groups]
dev = [
    "matplotlib (>=3.11.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "polars (>=1.43.1,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "commitizen (>=4.17.0,<5.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
